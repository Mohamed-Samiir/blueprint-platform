<form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-6">
  <header class="grid gap-1">
    <h1 class="text-xl font-semibold tracking-tight">Reset your password</h1>
    <p class="text-muted-foreground text-sm">Enter your email and we'll send you a reset code.</p>
  </header>

  <hlm-field>
    <label hlmFieldLabel for="forgot-email">Email</label>
    <input
      hlmInput
      id="forgot-email"
      type="email"
      autocomplete="email"
      inputmode="email"
      formControlName="email"
    />
    <hlm-field-error validator="required">Email is required.</hlm-field-error>
    <hlm-field-error validator="email">Enter a valid email address.</hlm-field-error>
  </hlm-field>

  <div class="grid gap-2">
    <button hlmBtn type="submit" class="w-full" [disabled]="pending()">
      @if (pending()) {
        <hlm-spinner class="me-2" />
      }
      Send reset code
    </button>
    <a hlmBtn variant="link" size="sm" routerLink="../../login">Back to sign in</a>
  </div>
</form>
