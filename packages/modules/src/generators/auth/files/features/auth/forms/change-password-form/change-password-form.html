<form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-6">
  <header class="grid gap-1">
    <h1 class="text-xl font-semibold tracking-tight">Change password</h1>
    <p class="text-muted-foreground text-sm">
      Confirm your current password, then choose a new one.
    </p>
  </header>

  @if (serverError()) {
    <div hlmAlert variant="destructive" role="alert">
      <span hlmAlertTitle>{{ serverError() }}</span>
    </div>
  }
  @if (done()) {
    <div hlmAlert role="status">
      <span hlmAlertTitle>Password changed.</span>
    </div>
  }

  <div class="grid gap-4">
    <hlm-field>
      <label hlmFieldLabel for="change-current">Current password</label>
      <hlm-input-group>
        <input
          hlmInputGroupInput
          id="change-current"
          [type]="showCurrent() ? 'text' : 'password'"
          autocomplete="current-password"
          formControlName="currentPassword"
        />
        <hlm-input-group-addon align="inline-end">
          <button
            hlmInputGroupButton
            size="icon-xs"
            [attr.aria-label]="showCurrent() ? 'Hide password' : 'Show password'"
            (click)="showCurrent.set(!showCurrent())"
          >
            <ng-icon [name]="showCurrent() ? 'lucideEyeOff' : 'lucideEye'" />
          </button>
        </hlm-input-group-addon>
      </hlm-input-group>
      <hlm-field-error validator="required">Enter your current password.</hlm-field-error>
    </hlm-field>

    <hlm-field>
      <label hlmFieldLabel for="change-new">New password</label>
      <hlm-input-group>
        <input
          hlmInputGroupInput
          id="change-new"
          [type]="showNew() ? 'text' : 'password'"
          autocomplete="new-password"
          formControlName="newPassword"
        />
        <hlm-input-group-addon align="inline-end">
          <button
            hlmInputGroupButton
            size="icon-xs"
            [attr.aria-label]="showNew() ? 'Hide password' : 'Show password'"
            (click)="showNew.set(!showNew())"
          >
            <ng-icon [name]="showNew() ? 'lucideEyeOff' : 'lucideEye'" />
          </button>
        </hlm-input-group-addon>
      </hlm-input-group>
      <hlm-field-error validator="required">Password is required.</hlm-field-error>
      <hlm-field-error validator="minlength"
        >Password must be at least 8 characters.</hlm-field-error
      >
    </hlm-field>

    <hlm-field>
      <label hlmFieldLabel for="change-confirm">Confirm new password</label>
      <hlm-input-group>
        <input
          hlmInputGroupInput
          id="change-confirm"
          [type]="showConfirm() ? 'text' : 'password'"
          autocomplete="new-password"
          formControlName="confirmPassword"
        />
        <hlm-input-group-addon align="inline-end">
          <button
            hlmInputGroupButton
            size="icon-xs"
            [attr.aria-label]="showConfirm() ? 'Hide password' : 'Show password'"
            (click)="showConfirm.set(!showConfirm())"
          >
            <ng-icon [name]="showConfirm() ? 'lucideEyeOff' : 'lucideEye'" />
          </button>
        </hlm-input-group-addon>
      </hlm-input-group>
      <hlm-field-error validator="required">Please confirm your password.</hlm-field-error>
      <hlm-field-error validator="mismatch">Passwords do not match.</hlm-field-error>
    </hlm-field>
  </div>

  <button hlmBtn type="submit" class="w-full" [disabled]="pending()">
    @if (pending()) {
      <hlm-spinner class="me-2" />
    }
    Update password
  </button>
</form>
