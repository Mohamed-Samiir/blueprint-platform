<form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-6">
  <header class="grid gap-1">
    <h1 class="text-xl font-semibold tracking-tight">Enter your code</h1>
    <p class="text-muted-foreground text-sm">We sent a 6-digit code {{ target }}.</p>
  </header>

  @if (serverError()) {
    <div hlmAlert variant="destructive" role="alert">
      <span hlmAlertTitle>{{ serverError() }}</span>
    </div>
  }

  <hlm-field>
    <label hlmFieldLabel for="forgot-code">6-digit code</label>
    <input
      hlmInput
      id="forgot-code"
      inputmode="numeric"
      autocomplete="one-time-code"
      maxlength="6"
      formControlName="code"
    />
    <hlm-field-error validator="required">Enter the code from your email.</hlm-field-error>
    <hlm-field-error validator="pattern">The code is 6 digits.</hlm-field-error>
  </hlm-field>

  <button hlmBtn type="submit" class="w-full" [disabled]="pending()">
    @if (pending()) {
      <hlm-spinner class="me-2" />
    }
    Verify code
  </button>
</form>
