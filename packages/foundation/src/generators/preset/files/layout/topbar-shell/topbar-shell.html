<hlm-sidebar-wrapper>
  <hlm-sidebar variant="sidebar" collapsible="icon" [side]="side()">
    <div hlmSidebarHeader [class]="collapsed() ? 'p-0!' : ''">
      <div
        [class]="
          collapsed()
            ? 'flex items-center justify-start py-1'
            : 'flex items-center gap-2 px-2 py-1.5'
        "
      >
        <img
          src="branding/logo.png"
          alt="Blueprint"
          [class]="
            collapsed() ? 'h-10 w-10 shrink-0 object-contain' : 'h-8 w-auto shrink-0 object-contain'
          "
        />
        <div class="flex flex-col group-data-[collapsible=icon]:hidden">
          <span class="text-sm font-semibold">Blueprint</span>
          <span class="text-sidebar-foreground/70 text-xs">variant: sidebar + top bar</span>
        </div>
      </div>
      <input
        hlmSidebarInput
        type="search"
        placeholder="Search…"
        aria-label="Search"
        class="group-data-[collapsible=icon]:hidden"
      />
    </div>

    <div
      hlmSidebarContent
      [class]="'bp-scrollbar-hidden' + (collapsed() ? ' overflow-y-auto!' : '')"
    >
      <div hlmSidebarGroup>
        <div hlmSidebarGroupContent>
          <ul hlmSidebarMenu>
            <li hlmSidebarMenuItem>
              <a
                hlmSidebarMenuButton
                routerLink="/"
                routerLinkActive
                [routerLinkActiveOptions]="{ exact: true }"
                #rlaWelcome="routerLinkActive"
                [isActive]="rlaWelcome.isActive"
                [tooltip]="'Welcome'"
              >
                <ng-icon name="lucideHouse" />
                <span>Welcome</span>
              </a>
            </li>
            <!-- BP:NAV_ITEMS -->
          </ul>
        </div>
      </div>
    </div>

    <button hlmSidebarRail></button>
  </hlm-sidebar>

  <main hlmSidebarInset class="flex min-h-svh flex-col">
    <!-- Top bar: a flow child of main[hlmSidebarInset], so it starts at the
         sidebar's inner edge and can never overlap the sidebar (A3). Sticky, not
         fixed, so it stays clipped to this pane. -->
    <header
      class="bg-background sticky top-0 z-40 flex h-14 shrink-0 items-center gap-2 border-b px-4"
    >
      <button hlmSidebarTrigger></button>
      <span class="text-sm font-medium">Topbar shell</span>

      <!-- topbar-shell puts the account menu (and its switchers) in the top bar,
           not the sidebar footer. -->
      <app-user-menu class="ms-auto w-auto max-w-64" />
    </header>

    <div class="flex-1 p-6">
      <router-outlet />
    </div>
  </main>
</hlm-sidebar-wrapper>
