<hlm-sidebar-wrapper>
  <hlm-sidebar variant="sidebar" collapsible="icon" [side]="side()">
    <div hlmSidebarHeader [class]="collapsed() ? 'p-0!' : ''">
      <div
        [class]="
          collapsed()
            ? 'flex items-center justify-start py-1'
            : 'flex items-center gap-2 px-2 py-1.5'
        "
      >
        <img
          src="branding/logo.png"
          alt="Blueprint"
          [class]="
            collapsed() ? 'h-10 w-10 shrink-0 object-contain' : 'h-8 w-auto shrink-0 object-contain'
          "
        />
        <div class="flex flex-col group-data-[collapsible=icon]:hidden">
          <span class="text-sm font-semibold">Blueprint</span>
          <span class="text-sidebar-foreground/70 text-xs">variant: sidebar</span>
        </div>
      </div>
      <input
        hlmSidebarInput
        type="search"
        placeholder="Search…"
        aria-label="Search"
        class="group-data-[collapsible=icon]:hidden"
      />
    </div>

    <div
      hlmSidebarContent
      [class]="'bp-scrollbar-hidden' + (collapsed() ? ' overflow-y-auto!' : '')"
    >
      <div hlmSidebarGroup>
        <div hlmSidebarGroupContent>
          <ul hlmSidebarMenu>
            <li hlmSidebarMenuItem>
              <a
                hlmSidebarMenuButton
                routerLink="/"
                routerLinkActive
                [routerLinkActiveOptions]="{ exact: true }"
                #rlaWelcome="routerLinkActive"
                [isActive]="rlaWelcome.isActive"
                [tooltip]="'Welcome'"
              >
                <ng-icon name="lucideHouse" />
                <span>Welcome</span>
              </a>
            </li>
            <!-- BP:NAV_ITEMS -->
          </ul>
        </div>
      </div>
    </div>

    <div hlmSidebarFooter>
      <app-user-menu />
    </div>

    <button hlmSidebarRail></button>
  </hlm-sidebar>

  <main hlmSidebarInset>
    <header class="flex h-14 items-center gap-2 border-b px-4">
      <button hlmSidebarTrigger></button>
      <span class="text-sm font-medium">Sidebar shell</span>
    </header>
    <div class="flex-1 p-6">
      <router-outlet />
    </div>
  </main>
</hlm-sidebar-wrapper>
