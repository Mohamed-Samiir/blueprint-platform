<hlm-sidebar-wrapper>
  <hlm-sidebar variant="floating" collapsible="offcanvas" [side]="side()">
    <div hlmSidebarHeader>
      <div class="flex items-center gap-2 px-2 py-1.5">
        <img
          src="branding/logo.png"
          alt="Blueprint"
          class="h-8 w-auto shrink-0 object-contain"
        />
        <div class="flex flex-col">
          <span class="text-sm font-semibold">Blueprint</span>
          <span class="text-sidebar-foreground/70 text-xs">variant: floating</span>
        </div>
      </div>
      <input hlmSidebarInput type="search" placeholder="Search…" aria-label="Search" />
    </div>

    <div hlmSidebarContent>
      <div hlmSidebarGroup>
        <div hlmSidebarGroupContent>
          <ul hlmSidebarMenu>
            <li hlmSidebarMenuItem>
              <a
                hlmSidebarMenuButton
                routerLink="/"
                routerLinkActive
                [routerLinkActiveOptions]="{ exact: true }"
                #rlaWelcome="routerLinkActive"
                [isActive]="rlaWelcome.isActive"
                [tooltip]="'Welcome'"
              >
                <ng-icon name="lucideHouse" />
                <span>Welcome</span>
              </a>
            </li>
            <!-- BP:NAV_ITEMS -->
          </ul>
        </div>
      </div>
    </div>

    <div hlmSidebarFooter>
      <app-user-menu />
    </div>

    <button hlmSidebarRail></button>
  </hlm-sidebar>

  <main hlmSidebarInset>
    <header class="flex h-14 items-center gap-2 border-b px-4">
      <button hlmSidebarTrigger></button>
      <span class="text-sm font-medium">Floating shell</span>
    </header>
    <div class="flex-1 p-6">
      <router-outlet />
    </div>
  </main>
</hlm-sidebar-wrapper>
