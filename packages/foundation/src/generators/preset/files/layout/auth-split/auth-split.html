<div class="bg-background flex min-h-svh">
  <aside
    class="bg-primary text-primary-foreground relative hidden shrink-0 flex-col justify-between overflow-hidden p-8 md:flex md:w-1/2 lg:w-3/5 lg:p-10 xl:p-14"
  >
    <div class="text-lg font-semibold">{{ brand }}</div>
    <div class="max-w-md space-y-3">
      <p class="text-2xl leading-snug font-medium lg:text-3xl">{{ tagline }}</p>
      <p class="text-primary-foreground/70 text-sm">{{ subtitle }}</p>
    </div>
    <p class="text-primary-foreground/60 text-xs">© {{ year }} {{ brand }}. All rights reserved.</p>
  </aside>

  <main
    class="bg-background flex min-w-0 flex-1 flex-col items-center justify-center gap-6 overflow-y-auto p-4 sm:p-6 lg:p-8"
  >
    <img src="branding/logo.png" alt="Blueprint" class="h-8 w-auto" />
    <section hlmCard class="w-full max-w-md">
      <div hlmCardContent>
        <router-outlet />
      </div>
    </section>
  </main>
</div>
