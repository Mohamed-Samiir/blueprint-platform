<div class="grid w-full justify-items-center gap-10 px-4 py-16 text-center sm:px-6">
  <img src="branding/logo.png" alt="Blueprint" class="h-16 w-auto" />

  <div class="grid gap-2">
    <h1 class="text-2xl font-semibold tracking-tight">Welcome to <%= name %></h1>
    <p class="text-muted-foreground text-sm">
      A reference architecture for building Angular apps, verified end to end.
    </p>
  </div>

  <div class="grid w-full max-w-4xl gap-4 text-start sm:grid-cols-3">
    @for (pillar of pillars; track pillar.title) {
      <section hlmCard>
        <div hlmCardHeader>
          <ng-icon [name]="pillar.icon" class="text-primary size-6" />
          <h3 hlmCardTitle class="mt-2">{{ pillar.title }}</h3>
          <p hlmCardDescription>{{ pillar.description }}</p>
        </div>
      </section>
    }
  </div>
</div>
